name = "portfolio"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# slvlkn.cc is attached as a custom domain, so the workers.dev URL is disabled.
workers_dev = false
preview_urls = false

# Capture console logs in the dashboard (Observability -> Logs).
[observability]
enabled = true

# GITHUB_USERNAME is public (it's rendered on the page), so it lives here and is applied on
# every deploy. GITHUB_TOKEN stays a Secret in the Worker dashboard — secrets survive
# deploys, but a plaintext var set only in the dashboard gets wiped by `wrangler deploy`.
[vars]
GITHUB_USERNAME = "slavaluka"
